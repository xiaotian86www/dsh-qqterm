# dsh-qqterm bundle patch
#
# 当本包通过 `dsh plugin --profile <name> add dsh-qqterm` 安装后，
# dsh 启动时自动加载此 patch。
#
# 环境变量：
#   QQBOT_APPID  - QQ Bot AppID（必填）
#   QQBOT_SECRET - QQ Bot AppSecret（必填）
#
# 叠加顺序：dsh-base → 本 bundle patch → profile cordis.patch.yml → --patch

# ── 插入 qqterm 插件行 ──
- insert:
    - id: qqterm
      name: 'dsh-qqterm'
      config:
        appId: __FROM_ENV__
        appSecret: __FROM_ENV__
