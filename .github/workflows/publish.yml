name: Publish

# 发布走 npmjs 的可信发布（OIDC）：不需要在仓库里放 NPM_TOKEN，也不用手工打包上传。
# 只上传到暂存区（npm stage publish），再到 npmjs 网页批准，批准后才对外可见。
# 这个包在 npmjs 上被设成「只能暂存」：直接 npm publish 会被拒，报
#   403 Forbidden - PUT https://registry.npmjs.org/<name> - OIDC permission denied for this action
# 前提是在 npmjs 的包设置里登记过本仓库 + 本工作流文件名；没登记时 npm 会退回匿名请求，报 404 / 401。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # OIDC 取换 npm 令牌的唯一前提，删掉这一行发布必失败。
  id-token: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      # 不设 registry-url：它会在 .npmrc 写死 _authToken=${NODE_AUTH_TOKEN}，
      # 占位符会被当成真令牌发出去，OIDC 就走不到。registry 在发布时显式传。
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag 与 package.json 的 $version 不一致，拒绝发布"
            exit 1
          fi

      - name: 构建
        run: pnpm build

      - name: 测试
        run: pnpm test

      # 补打历史 tag 时版本可能已经发布或已在暂存队列里，重复上传会 409。
      # 这里先探一次，命中就跳过上传，让重放的 tag 也能跑成绿的。
      - name: 检查版本是否已存在
        id: exists
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          registry="https://registry.npmjs.org/"
          present=false
          if npm view "$name@$version" version --registry="$registry" >/dev/null 2>&1; then
            present=true
            echo "::notice::$name@$version 已在 registry 上，跳过上传"
          fi
          staged="$(npm stage list "$name" --registry="$registry" 2>/dev/null \
            | awk -v v="$version" '$1=="version:"{cur=$2} $1=="status:"{if(cur==v && $2=="staged") f=1} END{print f?"yes":"no"}')"
          if [ "$staged" = "yes" ]; then
            present=true
            echo "::notice::$name@$version 已在暂存队列里，跳过上传"
          fi
          echo "present=$present" >> "$GITHUB_OUTPUT"

      - name: 上传暂存区
        if: steps.exists.outputs.present != 'true'
        run: npm stage publish --access public --registry=https://registry.npmjs.org/

      - name: 写入任务摘要
        if: always()
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          echo "### $name@$version" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.exists.outputs.present }}" = "true" ]; then
            echo "结果：该版本已发布或已暂存，本次跳过上传" >> "$GITHUB_STEP_SUMMARY"
            echo "https://www.npmjs.com/package/$name?v=$version" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "模式：只上传暂存区，需在 npmjs 批准后才对外可见" >> "$GITHUB_STEP_SUMMARY"
          echo "批准入口：https://www.npmjs.com/settings/xiaotian86www/staged-packages" >> "$GITHUB_STEP_SUMMARY"
          echo "https://www.npmjs.com/package/$name/v/$version" >> "$GITHUB_STEP_SUMMARY"
