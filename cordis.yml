# dsh-qqterm 组合配置示例
#
# 运行: pnpm dsh --config ./cordis.yml
#
# 环境变量:
#   QQBOT_APPID     - QQ Bot AppID
#   QQBOT_SECRET    - QQ Bot AppSecret
#   DEEPSEEK_API_KEY - DeepSeek API Key
#   DSH_CWD         - Agent 工作目录（可选）
#   DSH_PRESET_ROOT - 系统预置 preset 目录（可选，默认 ./apps/cli/config/agent-presets）

# ── 核心 spine ──
- id: sessions
  name: '@deepseek-ai/dsh-session'

- id: agent
  name: '@deepseek-ai/dsh-agent'

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: !!js "process.platform === 'win32' ? 'never' : ((process.env.DSH_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask')"

- id: tools
  name: '@deepseek-ai/dsh-tools'

# ── Agent Preset 服务（/preset 命令切换 preset 依赖） ──
- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  config:
    default: standard
    roots:
      # 系统预置 preset 目录（deepseek-harness 的 apps/cli/config/agent-presets，含 standard/code/cordis/minimal）
      - path: ${DSH_PRESET_ROOT:-./apps/cli/config/agent-presets}
        trust: system
    # includeUserRoot 默认 true：额外加载 $DSH_HOME/.agent-presets（用户自定义 preset）

# ── 附件存储（助手图片转发依赖 attachments 取图片字节） ──
- id: attachment-local
  name: '@deepseek-ai/dsh-attachment-local'

# ── LLM 适配器 ──
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKey: ${DEEPSEEK_API_KEY}

# ── 执行能力（按需启用） ──
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'

# ── 上下文管理 ──
- id: compaction
  name: '@deepseek-ai/dsh-compaction-basic'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

# ── 持久化 ──
- id: session-persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: ./.dsh-sessions

# ── QQ Bot IM 驱动 ──
- id: qqterm
  name: 'dsh-qqterm'
  config:
    appId: ${QQBOT_APPID}
    appSecret: ${QQBOT_SECRET}
